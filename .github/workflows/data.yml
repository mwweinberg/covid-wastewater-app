name: Refresh wastewater data
on:
  schedule:
    - cron: "17 6,18 * * *"   # twice daily, UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-refresh
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build per-city JSON
        run: python3 pipeline/build_data.py --out data
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- ':!data/manifest.json'; then
            echo "no data change"; exit 0
          fi
          git commit -m "data: refresh $(date -u +%F)"
          git push
